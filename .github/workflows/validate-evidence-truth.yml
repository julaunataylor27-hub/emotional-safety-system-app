name: Validate Evidence and Truth Lab
on:
  push:
    branches:
      - feature/evidence-truth-v1-2-20261012
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Test rules, uncertainty, and in-app navigation
        run: node --test tests/evidence-truth-engine.test.cjs tests/cultural-connections.test.cjs tests/cultural-inquiry.test.cjs tests/knowledge-trail.test.cjs tests/learning-together.test.cjs tests/explore-connections.test.cjs tests/law-rights-kinship.test.cjs tests/independence-commitment.test.cjs tests/safe-curiosity.test.cjs tests/safe-curiosity-knowledge.test.cjs tests/night-forest-interactions.test.cjs
      - name: Install React Native tooling
        run: npm install --include=dev
      - name: Prepare the same app source as the Android build
        run: |
          python3 - <<'PYBUILD'
          import re, subprocess, sys
          from pathlib import Path
          workflow = Path('.github/workflows/build-android-apk.yml').read_text()
          for script in re.findall(r'run: python (scripts/[a-z_0-9]+\.py)', workflow):
              subprocess.run([sys.executable, script], check=True)
          PYBUILD
      - name: Test the complete prepared app and navigation
        run: NODE_ENV=test npm test
      - name: Check JSX syntax of app and learning screens
        run: |
          node -e "const b=require('@babel/core'); for(const x of ['App.js','src/EvidenceTruthScreen.js','src/CulturalConnectionsScreen.js','src/CulturalInquiryScreen.js','src/KnowledgeTrailScreen.js','src/LearningTogetherScreen.js','src/ExploreConnectionsScreen.js','src/LawRightsKinshipScreen.js','src/IndependenceCommitmentScreen.js','src/SafeCuriosityScreen.js','src/NightForestScene.js','src/GoldenTreeHome.js','src/PresentationChrome.js','src/SupportDirectoryScreen.js','src/EvidenceTruthScreen.js']) { b.transformFileSync(x, {configFile:'./babel.config.js'}); console.log('JSX OK:',x) }"
