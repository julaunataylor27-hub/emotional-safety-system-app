name: Verify picture trail APK

on:
  push:
    branches: [codex/verify-tim-picture-release]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-picture-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 1
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Retrieve compiled prototype native package
        uses: actions/download-artifact@v4
        with:
          name: Emotional-Safety-System-Standalone-APK
          run-id: 39115138193
          github-token: ${{ github.token }}
          path: installed-apk
      - name: Install dependencies
        run: npm install --include=dev
      - name: Prepare application source
        run: |
          python3 scripts/patch_interactions.py
          python3 scripts/patch_emotional_reality.py
          python3 scripts/patch_intent_legal.py
          python3 scripts/patch_question_ui_cleanup.py
          python3 scripts/patch_structural_safety.py
          python3 scripts/patch_coercion.py
          python3 scripts/patch_child_parent_safeguard.py
          python3 scripts/patch_coercion_legal.py
          python3 scripts/patch_brand_redesign.py
          python3 scripts/patch_exact_home_art.py
          python3 scripts/patch_humanity_philosophy.py
          python3 scripts/patch_premium_humanity_design.py
          python3 scripts/patch_nextgen_humanity_app.py
          python3 scripts/patch_nextgen_syntax_fix.py
          python3 scripts/patch_full_humanity_experience.py
          python3 scripts/patch_full_humanity_fix.py
          python3 scripts/validate_approved_graphics.py
          python3 scripts/patch_approved_graphics_v1.py
          python3 scripts/patch_results_crash_guard.py
          python3 scripts/patch_journey_memory.py
          python3 scripts/patch_journey_pdf.py
          python3 scripts/patch_journal_progress.py
          python3 scripts/patch_explanation_tabs.py
          python3 scripts/patch_diamond_effect.py
          python3 scripts/patch_observed_responses.py
          python3 scripts/patch_support_tabs.py
          python3 scripts/patch_evidence_truth_lab.py
          python3 scripts/patch_golden_tree_home.py
          python3 scripts/patch_life_journey.py
          python3 scripts/patch_presentation_polish.py
          python3 scripts/patch_living_connections.py
          python3 scripts/patch_cultural_inquiry.py
          python3 scripts/patch_knowledge_trail.py
          python3 scripts/patch_learning_together.py
          python3 scripts/patch_explore_connections.py
          python3 scripts/patch_support_directory.py
      - name: Test application and validate source
        run: |
          NODE_ENV=test npm test
          python3 scripts/validate_patched_app.py
          python3 -m py_compile scripts/android_smoke.py scripts/refresh_picture_apk.py
      - name: Check native inputs match the compiled base
        run: git diff --exit-code 25a494ddec30909d933b0c097c284b7a7f544717 -- package.json app.json assets
      - name: Generate matching native signing configuration
        run: npx expo prebuild --platform android --clean
      - name: Export corrected Android Hermes bundle
        run: npx expo export:embed --platform android --entry-file node_modules/expo/AppEntry.js --dev false --minify false --bytecode --bundle-output refreshed/index.android.bundle --assets-dest refreshed/res
      - name: Refresh JavaScript payload and preserve native package
        run: python3 scripts/refresh_picture_apk.py installed-apk/Emotional-Safety-System-Standalone.apk refreshed/index.android.bundle refreshed/unsigned.apk
      - name: Align, sign and verify matching prototype certificate
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -P 16 -f 4 refreshed/unsigned.apk refreshed/aligned.apk
          "$BUILD_TOOLS/apksigner" sign --ks android/app/debug.keystore --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --out Emotional-Safety-System-v1.7.8-Picture-Trail.apk refreshed/aligned.apk
          "$BUILD_TOOLS/zipalign" -c -P 16 4 Emotional-Safety-System-v1.7.8-Picture-Trail.apk
          "$BUILD_TOOLS/apksigner" verify --print-certs Emotional-Safety-System-v1.7.8-Picture-Trail.apk > certificate.txt
          cat certificate.txt
          python3 -c "from pathlib import Path; assert 'fac61745dc0903786fb9ede62a962b399f7348f0bb6f899b8332667591033b9c' in Path('certificate.txt').read_text().lower()"
          sha256sum Emotional-Safety-System-v1.7.8-Picture-Trail.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check corrected pictures, support, saved notes and reflection on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android_smoke.py Emotional-Safety-System-v1.7.8-Picture-Trail.apk --picture-release-check --journey-and-reflection --life-journey
      - name: Save installed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Picture-trail-Android-evidence
          path: |
            android-smoke
            picture-apk-refresh.json
            certificate.txt
          retention-days: 7
      - name: Save verified corrected APK
        uses: actions/upload-artifact@v4
        with:
          name: Emotional-Safety-System-Picture-Trail-Verified-APK
          path: Emotional-Safety-System-v1.7.8-Picture-Trail.apk
          retention-days: 30
