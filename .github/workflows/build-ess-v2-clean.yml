name: Build ESS v2 Content Integration APK

on:
  push:
    branches: [ess-v2-content-integration-20261102]
    paths:
      - 'v2/**'
      - '.github/workflows/build-ess-v2-clean.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install v2 dependencies
        run: npm install
      - name: Prepare attributed 2027 photographic assets
        run: npm run prepare:art
      - name: Verify all offline 2027 scenes were prepared
        run: |
          test "$(find assets/scenes -maxdepth 1 -name '*.jpg' | wc -l)" -eq 10
          test ! -d assets/graphics
      - name: Test v2 core and clean structure
        run: npm test
      - name: Generate clean Android project
        run: npx expo prebuild --platform android --clean
      - name: Build v2 release APK
        run: cd android && ./gradlew assembleRelease --no-daemon
      - name: Copy v2 APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ESS-v2-Content-Integration.apk
      - name: Upload v2 APK
        uses: actions/upload-artifact@v4
        with:
          name: ESS-v2-Content-Integration-APK
          path: v2/ESS-v2-Content-Integration.apk
          if-no-files-found: error
          retention-days: 30
