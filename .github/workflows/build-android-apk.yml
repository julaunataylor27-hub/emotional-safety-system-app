name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 1
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Enable interactive Learning and About screens
        run: python scripts/patch_interactions.py

      - name: Add Emotional Reality equation and capacity overrides
        run: python scripts/patch_emotional_reality.py

      - name: Add intent router and WA legal information checks
        run: python scripts/patch_intent_legal.py

      - name: Clean question-mode form
        run: python scripts/patch_question_ui_cleanup.py

      - name: Add structural safety, conflicts and Unknown signal states
        run: python scripts/patch_structural_safety.py

      - name: Add coercion detection and consent-safety layer
        run: python scripts/patch_coercion.py

      - name: Strengthen child-parent safeguarding and secrecy indicators
        run: python scripts/patch_child_parent_safeguard.py

      - name: Add WA sexual coercion legal references
        run: python scripts/patch_coercion_legal.py

      - name: Apply approved riders cultural-tech brand design
        run: python scripts/patch_brand_redesign.py

      - name: Put exact Australia code artwork on Home screen
        run: python scripts/patch_exact_home_art.py

      - name: Build interactive Humanity Philosophy journey
        run: python scripts/patch_humanity_philosophy.py

      - name: Apply premium Humanity Philosophy visual design
        run: python scripts/patch_premium_humanity_design.py

      - name: Build next-generation Humanity Philosophy experience
        run: python scripts/patch_nextgen_humanity_app.py

      - name: Guard Results screen against missing result fields
        run: python scripts/patch_results_crash_guard.py

      - name: Validate routed legal-question interface
        run: python scripts/validate_patched_app.py

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify bundled JavaScript and rename APK
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Emotional-Safety-System-Standalone.apk

      - name: Upload standalone APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Emotional-Safety-System-Standalone-APK
          path: Emotional-Safety-System-Standalone.apk
          if-no-files-found: error
          retention-days: 30
