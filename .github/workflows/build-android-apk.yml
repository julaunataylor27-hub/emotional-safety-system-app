name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 1
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --include=dev

      - name: Enable interactive Learning and About screens
        run: python scripts/patch_interactions.py

      - name: Add Emotional Reality equation and capacity overrides
        run: python scripts/patch_emotional_reality.py

      - name: Add intent router and WA legal information checks
        run: python scripts/patch_intent_legal.py

      - name: Clean question-mode form
        run: python scripts/patch_question_ui_cleanup.py

      - name: Add structural safety, conflicts and Unknown signal states
        run: python scripts/patch_structural_safety.py

      - name: Add coercion detection and consent-safety layer
        run: python scripts/patch_coercion.py

      - name: Strengthen child-parent safeguarding and secrecy indicators
        run: python scripts/patch_child_parent_safeguard.py

      - name: Add WA sexual coercion legal references
        run: python scripts/patch_coercion_legal.py

      - name: Apply approved riders cultural-tech brand design
        run: python scripts/patch_brand_redesign.py

      - name: Put exact Australia code artwork on Home screen
        run: python scripts/patch_exact_home_art.py

      - name: Build interactive Humanity Philosophy journey
        run: python scripts/patch_humanity_philosophy.py

      - name: Apply premium Humanity Philosophy visual design
        run: python scripts/patch_premium_humanity_design.py

      - name: Build next-generation Humanity Philosophy experience
        run: python scripts/patch_nextgen_humanity_app.py

      - name: Repair next-generation source syntax
        run: python scripts/patch_nextgen_syntax_fix.py

      - name: Expand to full seven-stage Humanity experience
        run: python scripts/patch_full_humanity_experience.py

      - name: Apply cinematic image compatibility and polish
        run: python scripts/patch_full_humanity_fix.py

      - name: Verify approved graphics v1
        run: python scripts/validate_approved_graphics.py

      - name: Connect approved standalone graphics v1
        run: python scripts/patch_approved_graphics_v1.py

      - name: Guard Results screen against missing result fields
        run: python scripts/patch_results_crash_guard.py

      - name: Connect summary and device-local journey memory
        run: python scripts/patch_journey_memory.py

      - name: Connect personal PDF documents and save controls
        run: python scripts/patch_journey_pdf.py

      - name: Connect Journal tabs and journey progress
        run: python scripts/patch_journal_progress.py

      - name: Connect explanation Signals, Emotion and Context tabs
        run: python scripts/patch_explanation_tabs.py

      - name: Connect structural fact review and Diamond Effect planner
        run: python scripts/patch_diamond_effect.py

      - name: Connect multiple per-person observed responses
        run: python scripts/patch_observed_responses.py

      - name: Connect interactive WA and National support tabs
        run: python scripts/patch_support_tabs.py

      - name: Test memory, PDFs, assessment tabs, Diamond, observations and support
        run: NODE_ENV=test npm test

      - name: Validate routed legal-question interface
        run: python scripts/validate_patched_app.py

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean

      - name: Build standalone release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify bundled JavaScript and rename APK
        id: release
        run: |
          test -f android/app/build/outputs/apk/release/app-release.apk
          cp android/app/build/outputs/apk/release/app-release.apk Emotional-Safety-System-Standalone.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test release startup and reflection graphics on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android_smoke.py Emotional-Safety-System-Standalone.apk

      - name: Save installed-app test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-release-smoke-test
          path: android-smoke
          if-no-files-found: warn
          retention-days: 7

      - name: Upload standalone APK artifact
        if: ${{ !cancelled() && steps.release.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: Emotional-Safety-System-Standalone-APK
          path: Emotional-Safety-System-Standalone.apk
          if-no-files-found: error
          retention-days: 30
