name: Import Approved Graphics v1

on:
  push:
    branches: [main]
    paths:
      - 'assets/graphics/Emotional-Safety-System-Approved-Graphics-v1.zip'

permissions:
  contents: write

jobs:
  import-graphics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract approved app graphics and masters
        run: |
          set -euo pipefail
          ARCHIVE="assets/graphics/Emotional-Safety-System-Approved-Graphics-v1.zip"
          test -f "$ARCHIVE"
          mkdir -p assets/graphics/masters
          unzip -jo "$ARCHIVE" 'emotional-safety-graphics/app/*.webp' -d assets/graphics
          unzip -jo "$ARCHIVE" 'emotional-safety-graphics/masters/*.png' -d assets/graphics/masters

      - name: Verify approved graphics
        run: python scripts/validate_approved_graphics.py

      - name: Commit extracted approved graphics
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/graphics/*.webp assets/graphics/masters/*.png
          if git diff --cached --quiet; then
            echo "Approved graphics are already imported."
            exit 0
          fi
          git commit -m "Import approved graphics v1 [skip ci]"
          git push
