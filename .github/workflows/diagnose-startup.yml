name: Diagnose installed app startup
on:
  push:
    branches: [diagnose-startup-20261007]
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Emotional-Safety-System-Standalone-APK
          run-id: 37555929469
          github-token: ${{ github.token }}
          path: installed-apk
      - name: Verify tested APK
        run: python3 -c "import hashlib; from pathlib import Path; p=Path('installed-apk/Emotional-Safety-System-Standalone.apk'); assert hashlib.sha256(p.read_bytes()).hexdigest() == 'dae757ce469524cb0a1b7976636405a2e0e4e99204a6c2635b74e49e69a0b853'"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch installed APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android_smoke.py installed-apk/Emotional-Safety-System-Standalone.apk
      - name: Save startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-startup-diagnostics
          path: android-smoke
          if-no-files-found: warn
          retention-days: 7
