name: Verify version 1.7.1 Android installer
on:
  push:
    branches: [codex/verify-apk-171-20261015]
permissions:
  contents: read
  actions: read
jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Emotional-Safety-System-Standalone-APK
          run-id: 38698270382
          github-token: ${{ github.token }}
          path: installed-apk
      - name: Verify exact version 1.7.1 APK
        run: python3 -c "import hashlib; from pathlib import Path; p=Path('installed-apk/Emotional-Safety-System-Standalone.apk'); assert hashlib.sha256(p.read_bytes()).hexdigest() == 'b540e31e2b5432eb2107eb559a1d12c725aea6d69eafe1b7fbcc79fa22ace768'"
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check installed APK and Living connections on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 scripts/android_smoke.py installed-apk/Emotional-Safety-System-Standalone.apk --life-journey --living-connections
      - name: Save installed-app evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-v171-verification
          path: android-smoke
          if-no-files-found: warn
          retention-days: 7
